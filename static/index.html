<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GeoClaw-LS</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="bg-orb orb-a"></div>
  <div class="bg-orb orb-b"></div>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="logo-wrap">
          <div class="logo">GeoClaw-LS</div>
          <div class="logo-sub">地质滑坡智能助手 V2.2.0</div>
        </div>
        <button id="newSessionBtn" class="btn btn-green">+ 新建对话</button>
        <input id="sessionSearch" class="input" placeholder="搜索历史会话" />
        <div class="sub-title">历史对话</div>
        <div id="sessionList" class="session-list"></div>
      </div>
      <div class="sidebar-bottom">
        <div class="sidebar-actions">
          <div id="kbMenuWrap" class="menu-wrap">
            <button id="toggleKbMenuBtn" class="btn btn-outline">知识库</button>
            <div class="menu-panel">
              <button id="openKbConsoleBtn" class="btn btn-outline small menu-item">打开控制台</button>
            </div>
          </div>
        </div>
        <div id="statusText" class="status">就绪</div>
        <button id="kbResetBtn" class="btn btn-outline danger small">系统重置</button>
      </div>
    </aside>

    <main class="main">
      <div class="workspace-topbar">
        <button id="openObservabilityBtn" class="btn btn-outline small">观测链路</button>
        <button id="openSettingsBtn" class="btn btn-outline small">设置</button>
      </div>
      <div class="workspace-body">
        <div class="workspace-main">
          <header class="header">
            <div class="header-meta">
              <div class="header-eyebrow">工作区</div>
              <div id="headerTitle">当前会话</div>
            </div>
            <div class="header-actions">
              <button id="clearSessionBtn" class="btn btn-outline danger small">清除当前会话</button>
            </div>
          </header>
          <section id="chatArea" class="chat-area"></section>
        </div>
        <aside id="taskWorkbench" class="task-workbench">
          <div class="task-workbench-title">任务工作台</div>
          <div class="task-workbench-sub">最近任务</div>
          <div id="taskList" class="task-list"></div>
          <div class="task-workbench-sub">任务详情</div>
          <div id="taskDetail" class="task-detail">暂无任务</div>
        </aside>
      </div>

      <footer class="input-box">
        <div class="editor-row">
          <textarea id="questionInput" placeholder="输入你的问题，Enter发送，Shift+Enter换行"></textarea>
          <div class="send-col">
            <button id="uploadDataBtn" class="btn btn-outline small" type="button">上传数据</button>
            <button id="sendBgBtn" class="btn btn-outline small" type="button">后台执行</button>
            <button id="sendBtn" class="btn btn-green">发送</button>
          </div>
        </div>
        <div id="uploadHint" class="upload-hint">支持 .csv/.xlsx/.xls/.txt/.json，上传后可直接输入“分析这个文件”。</div>
        <input id="dataFileInput" type="file" accept=".csv,.xlsx,.xls,.txt,.json" class="hidden" />
      </footer>
    </main>
  </div>

  <div id="settingsPanel" class="settings hidden">
    <div class="settings-inner">
      <div class="settings-toolbar">
        <div class="settings-title">系统设置</div>
        <input id="settingSearch" class="input inline-input grow" placeholder="搜索参数名、路径、用途或当前值" />
        <button id="exportBtn" class="btn btn-outline small">导出配置</button>
        <button id="importBtn" class="btn btn-outline small">导入配置</button>
        <button id="resetBtn" class="btn btn-outline small">恢复默认</button>
        <button id="closeSettingsBtn" class="btn btn-outline small">关闭</button>
      </div>

      <div class="settings-body">
        <aside id="treePanel" class="tree-panel"></aside>
        <section id="formPanel" class="form-panel"></section>
        <aside id="hintPanel" class="hint-panel">
          <h3>参数详情</h3>
          <div id="hintContent">在中间列表中选择参数，可查看用途、类型、默认值和调整建议。</div>
        </aside>
      </div>

      <div class="settings-footer">
        <span id="settingsStatus">未修改</span>
        <button id="saveSettingsBtn" class="btn btn-green">保存参数</button>
      </div>
    </div>
    <input id="importFileInput" type="file" accept=".yaml,.yml" class="hidden" />
  </div>

  <div id="kbPanel" class="settings hidden">
    <div class="settings-inner">
      <div class="settings-toolbar">
        <div class="settings-title">知识库控制台</div>
        <button id="kbAddDocBtn" class="btn btn-outline small">添加资料</button>
        <button id="kbRefreshBtn" class="btn btn-outline small">状态同步</button>
        <button id="syncKbBtn" class="btn btn-outline small">增加索引</button>
        <button id="kbRebuildBtn" class="btn btn-outline danger small">全量重建</button>
        <button id="closeKbBtn" class="btn btn-outline small">关闭</button>
      </div>

      <div class="settings-body">
        <section class="form-panel">
          <h3>文档索引</h3>
          <div id="kbDocsContent" class="mono-block"></div>
        </section>
        <section class="form-panel kb-graph-panel">
          <div class="kb-graph-head">
            <h3 id="kbGraphTitle">知识图谱</h3>
            <button id="kbGraphActionBtn" class="btn btn-outline small kb-graph-action" type="button" disabled>图谱构建中</button>
          </div>
          <div id="kbGraphCanvas" class="kb-graph-canvas">请先在左侧选择一篇文档</div>
          <div id="kbGraphNote" class="kb-graph-note">当前为按文档切换图谱视图（占位模式），后续可接入实体关系图。</div>
        </section>
      </div>
    </div>
    <input id="kbDocFileInput" type="file" accept=".pdf,.docx,.txt" class="hidden" />
  </div>

  <div id="dialogMask" class="dialog-mask hidden" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
    <div class="dialog-card">
      <div id="dialogTitle" class="dialog-title">提示</div>
      <div id="dialogMessage" class="dialog-message"></div>
      <input id="dialogInput" class="input dialog-input hidden" />
      <div class="dialog-actions">
        <button id="dialogCancelBtn" class="btn btn-outline small">取消</button>
        <button id="dialogOkBtn" class="btn btn-green small">确定</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
