agent:
  max_context_len: 16000
  max_history_rounds: 8
chunking:
  child:
    default_chunk_size: 420
    numeric_chunk_size: 360
    numeric_threshold: 60
  dynamic:
    base_ratio: 0.12
    digit_bonus: 30
    digit_ratio_threshold: 0.15
    max_ratio: 0.28
    min_overlap: 30
    short_line_bonus: 30
    table_bonus: 40
  parent:
    default_chunk_size: 1300
    large_chunk_size: 1800
    large_threshold: 2200
graph:
  answer_confidence:
    high_threshold: 0.75
    medium_threshold: 0.45
    need_kb_context_weight: 0.35
    need_kb_retrieval_weight: 0.65
    no_kb_floor: 0.55
    replan_penalty_cap: 0.24
    replan_penalty_step: 0.08
  replan_max_attempts: 2
  replan_on_low_quality: true
  replan_low_quality_threshold: 0.3
  replan_require_expansion: true
  step_result_max_chars: 9000
keyword_rerank:
  stop_words:
  - 的
  - 了
  - 和
  - 是
  - 就
  - 都
  - 而
  - 及
  - 与
  - 在
  - 这
  - 那
  - 有
  - 个
  - 之
  - 吗
  - 呢
  - 啊
keywords:
  analysis:
  - 分析
  - 预测
  - 模型
  - 数据
  - csv
  - xlsx
  - 随机森林
  - 深度学习
  - 机器学习
  - 导入
  complex:
  - 滑坡
  - 地质
  - 灾害
  - 诱发
  - 防治
  - 监测
  - 降雨
  complex_calc:
  - 公式
  - 参数
  - 系数
  - 模型
  - 依据
  - 根据
  - 查
  - 资料
  math:
  - 计算
  - 多少
  - +
  - '-'
  - '*'
  - /
  - 加
  - 减
  - 乘
  - 除
  - 等于
  - 几
  memory_query:
  - 我刚才
  - 刚才问
  - 上一个问题
  - 前面问
  - 你刚才
  - 你刚刚
  - 复述
  - 回顾
  - 我们聊了什么
  - 总结一下我们的对话
  - 总结我们刚才
  - 上次
  - 上一轮
  - 之前问
  - 之前说
  - 问了什么
  - 说了什么
  - 问了啥
  - 说了啥
  small_talk:
  - 在吗
  - 你是谁
  - 你好
  - hi
  - hello
  - unknown
  - 未知
  small_talk_punctuation:
  - '?'
  - ？
  - '!'
  - ！
  - .
  - 。
  - '...'
  - …
llm:
  temperatures:
    discovery: 0.6
    keyword_expansion: 0.1
    metadata_filter: 0.1
    semantic_rewrite: 0.2
    terminology_fix_insar: 0.2
    terminology_rewrite: 0.1
models:
  provider: ollama
  api:
    base_url: ''
    api_key: ''
    model: gpt-4o-mini
    timeout: 35
    stream_timeout: 70
    max_tokens: 0
  embedding: qwen3-embedding:4b
  embedding_backend: ollama
  embedding_ollama_batch_size: 16
  embedding_ollama_timeout: 60
  embedding_ollama_url: http://localhost:11434/api/embed
  ollama:
    model: qwen2.5:7b
    stream_timeout: 70
    temperature: 0.7
    timeout: 35
    url: http://localhost:11434/api/generate
  rerank: BAAI/bge-reranker-base
rag:
  batch_size: 500
  expansion_min_improvement: 0.15
  expansion_top_k: 4
  max_chunk_length: 2000
  quality_min_hits: 2
  quality_min_similarity: 0.45
  quality_min_source_diversity: 0.5
  quality_threshold: 0.45
  rerank_strategy: keyword
  search_top_k: 3
  vector_collection_name: knowledge_base
kb_watcher:
  enabled: true
  notify_no_change: false
  poll_interval_seconds: 3
  settle_seconds: 2
observability:
  enabled: false
synthesis:
  max_evidence_chars: 800
system:
  hf_endpoint: https://hf-mirror.com
terminology:
  allowed_english_words:
  - InSAR
  - SAR
  - DNA
  - GPS
  - AI
  insar_bad_phrases:
  - 热红外
  - 室内扫描
  - 地物成像
  - 多光谱
  - 光学
  - 红外
  - 地成学
  replacements:
  - - 地成学（InSAR）
    - 干涉合成孔径雷达（InSAR）
  - - InSAR（地物成像技术）
    - 干涉合成孔径雷达（InSAR）
  - - InSAR（热红外成像）
    - 干涉合成孔径雷达（InSAR）
tool:
  calculator_max_expression_len: 100
  discovery_top_k: 8
  rag_top_k: 4
vector_search:
  cache:
    enabled: true
    max_size: 512
    ttl_seconds: 900
  candidate_multiplier: 2
  hnsw:
    ef_construction: 200
    ef_search: 80
    m: 32
    space: cosine
  max_chunks_per_doc: 2
  max_workers: 4
  pre_rerank:
    max_per_doc: 3
    min_section_coverage: 0.6
  rrf_k: 60
retrieval:
  fast_path:
    enabled: true
    quality_margin: 0.1
    skip_for_complex_questions: true
  metrics:
    enabled: true
    log_path: logs/retrieval_metrics.jsonl
    window: 200
